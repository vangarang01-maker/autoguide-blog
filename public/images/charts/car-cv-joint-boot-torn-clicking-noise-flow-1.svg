      .ttl { fill: #f1f5f9; }
      .arw { stroke: #60a5fa; }
      .ahp { fill: #60a5fa; }
    }
  </style>
  <rect class="bg" width="720" height="180" rx="10"/>
  <text class="ttl" x="24" y="30">장거리 출발 전 5분 자가진단 4단계</text>
  <line class="arw" x1="352" y1="70.5" x2="368" y2="70.5" marker-end="url(#ah)"/>
  <line class="arw" x1="534.5" y1="95" x2="534.5" y2="116" marker-end="url(#ah)"/>
  <line class="arw" x1="368" y1="141.5" x2="352" y2="141.5" marker-end="url(#ah)"/>
  <rect class="box" x="24" y="50" width="323" height="41" rx="8"/>
  <text class="nd" text-anchor="middle">
    <tspan x="185.5" y="75.5">1단계: 조향각 최대 회전</tspan>
  </text>
  <rect class="box" x="373" y="50" width="323" height="41" rx="8"/>
  <text class="nd" text-anchor="middle">
    <tspan x="534.5" y="75.5">2단계: 휠하우스 플래시 점검</tspan>
  </text>
  <rect class="box" x="373" y="121" width="323" height="41" rx="8"/>
  <text class="nd" text-anchor="middle">
    <tspan x="534.5" y="146.5">3단계: 서스펜션 구리스 비산 확인</tspan>
  </text>
  <rect class="box" x="24" y="121" width="323" height="41" rx="8"/>
  <text class="nd" text-anchor="middle">
    <tspan x="185.5" y="146.5">4단계: 저속 유턴 청음 테스트</tspan>
