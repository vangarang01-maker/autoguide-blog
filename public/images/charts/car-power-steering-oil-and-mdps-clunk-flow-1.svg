<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-label="MDPS(전동식) vs 유압식 파워 스티어링: 조향 보조 메커니즘의 차이 — 스티어링 휠">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahp" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <style>
    .bg  { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .nd  { fill: #0f172a; font: 600 13px system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
    .ttl { fill: #0f172a; font: 600 15px system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
    .arw { stroke: #2563eb; stroke-width: 2; }
    .ahp { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .bg  { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #334155; }
