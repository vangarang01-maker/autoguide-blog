      .ttl { fill: #f1f5f9; }
      .arw { stroke: #60a5fa; }
      .ahp { fill: #60a5fa; }
    }
  </style>
  <rect class="bg" width="720" height="180" rx="10"/>
  <text class="ttl" x="24" y="30">MDPS(전동식) vs 유압식 파워 스티어링: 조향 보조 메커니즘의 차이 — 스티어링 휠</text>
  <line class="arw" x1="235" y1="70.5" x2="251" y2="70.5" marker-end="url(#ah)"/>
  <line class="arw" x1="467" y1="70.5" x2="483" y2="70.5" marker-end="url(#ah)"/>
  <line class="arw" x1="591" y1="95" x2="591" y2="116" marker-end="url(#ah)"/>
  <line class="arw" x1="483" y1="141.5" x2="467" y2="141.5" marker-end="url(#ah)"/>
  <rect class="box" x="24" y="50" width="206" height="41" rx="8"/>
  <text class="nd" text-anchor="middle">
    <tspan x="127" y="75.5">스티어링 휠</tspan>
  </text>
  <rect class="box" x="256" y="50" width="206" height="41" rx="8"/>
  <text class="nd" text-anchor="middle">
    <tspan x="359" y="75.5">토크 센서</tspan>
  </text>
  <rect class="box" x="488" y="50" width="206" height="41" rx="8"/>
  <text class="nd" text-anchor="middle">
    <tspan x="591" y="75.5">전동 모터 + 플렉시블 커플링</tspan>
