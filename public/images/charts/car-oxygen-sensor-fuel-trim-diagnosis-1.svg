<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 164" width="720" height="164" role="img" aria-label="총예상 비용 (1개당) 비교">
  <style>
    .bg    { fill: #f8fafc; }
    .ttl   { fill: #0f172a; font: 600 15px system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
    .lbl   { fill: #475569; font: 500 13px system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
    .val   { fill: #0f172a; font: 600 12px system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
    .track { fill: #e2e8f0; }
    .bar   { fill: #2563eb; }
    .range { fill: #2563eb; opacity: .32; }
    .note  { fill: #94a3b8; font: 400 11px system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0f172a; }
      .ttl   { fill: #f1f5f9; }
      .lbl   { fill: #94a3b8; }
      .val   { fill: #f1f5f9; }
      .track { fill: #1e293b; }
      .bar   { fill: #60a5fa; }
      .range { fill: #60a5fa; opacity: .32; }
      .note  { fill: #64748b; }
    }
  </style>
  <rect class="bg" width="720" height="164" rx="10"/>
  <text class="ttl" x="24" y="30">총예상 비용 (1개당) 비교</text>
  <text class="lbl" x="178" y="68" text-anchor="end">현대모비스 순정품</text>
  <rect class="track" x="190" y="57" width="390" height="18" rx="4"/>
  <rect class="range" x="459.0" y="57" width="121.0" height="18" rx="4"/>
  <rect class="bar" x="190" y="57" width="269.0" height="18" rx="4"/>
  <text class="val" x="590" y="68">10만원~14.5만원</text>
  <text class="lbl" x="178" y="110" text-anchor="end">보쉬</text>
  <rect class="track" x="190" y="99" width="390" height="18" rx="4"/>
  <rect class="range" x="364.8" y="99" width="107.6" height="18" rx="4"/>
  <rect class="bar" x="190" y="99" width="174.8" height="18" rx="4"/>
  <text class="val" x="590" y="110">6.5만원~10.5만원</text>
  <text class="note" x="24" y="154">지역·정비소 유형·차종에 따라 달라지는 참고 범위입니다.</text>
</svg>
