name: Generate Images (charts + heroes)

# 글 발행과 분리된 이미지 전용 워크플로.
# 기존 글에 차트와 히어로 이미지를 붙이거나 다시 만들 때 수동으로 돌린다.
on:
  workflow_dispatch:
    inputs:
      force_photos:
        description: '카드만 있는 글에 Pexels 사진을 다시 시도한다'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: generate-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate cost charts
        run: node scripts/generate-diagrams.mjs

      - name: Generate hero images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate-heroes.mjs ${{ inputs.force_photos && '--force' || '' }}

      - name: Verify build
        run: npm run build

      - name: Commit and push
        run: |
          git config --global user.name "AutoGuide Bot"
          git config --global user.email "bot@autoguide-pro.com"
          if [ -n "$(git status --porcelain src/content/blog public/images)" ]; then
            git add src/content/blog/ public/images/
            git commit -m "chore(images): regenerate charts and hero images [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No image changes."
          fi
