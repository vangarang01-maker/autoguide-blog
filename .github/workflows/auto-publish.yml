name: Auto Publish Articles (AutoGuide)

# 자동 스케줄 재개 (2026-09-01).
# 중단 사유였던 껍데기 글 대량 생성은 해결됐다: 템플릿 폴백 제거, 품질 게이트 도입,
# 토픽 소진 시 중복 발행 대신 실패. 6편 연속 발행으로 검증했다.
#
# 하루 2회에서 주 2회로 줄였다. 토픽뱅크 잔량이 유한하고(현재 23개),
# 소진되면 발행 대신 실패하므로 그때 TOPICS 에 주제를 보충해야 한다.
on:
  schedule:
    - cron: '0 23 * * 0,3'   # 월/목 08:00 KST (일·수 23:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Auto Publisher (Gemini AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.7-flash'
        run: node scripts/auto-publish.mjs

      # 새 글의 비용 표에서 차트를 만들고 히어로 이미지를 붙인다.
      # PEXELS_API_KEY 가 없으면 SVG 히어로 카드로 대체되므로 실패하지 않는다.
      - name: Generate charts and hero images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: npm run gen:images

      - name: Commit and Push changes
        run: |
          git config --global user.name "AutoGuide Bot"
          git config --global user.email "bot@autoguide-pro.com"
          if [ -n "$(git status --porcelain src/content/blog public/images)" ]; then
            git add src/content/blog/ public/images/
            git commit -m "chore(blog): auto publish new article [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new articles generated."
          fi
