name: Auto Publish Articles (AutoGuide)

# 자동 스케줄 중단 (2026-09-01)
# 사유: 폴백 템플릿이 실질 내용 없는 글을 대량 생성해 AdSense 콘텐츠 품질 정책에 저촉.
#       생성기 프롬프트 및 품질 게이트 정비 완료 전까지 수동 실행만 허용한다.
#       재개 시 아래 schedule 블록의 주석을 해제하되, 주 2회(월/목) 이하를 권장.
#
# on:
#   schedule:
#     - cron: '0 23 * * 0,3'   # 월/목 08:00 KST
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Auto Publisher (Gemini AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.7-flash'
        run: node scripts/auto-publish.mjs

      # 새 글의 비용 표에서 차트를 만들고 히어로 이미지를 붙인다.
      # PEXELS_API_KEY 가 없으면 SVG 히어로 카드로 대체되므로 실패하지 않는다.
      - name: Generate charts and hero images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: npm run gen:images

      - name: Commit and Push changes
        run: |
          git config --global user.name "AutoGuide Bot"
          git config --global user.email "bot@autoguide-pro.com"
          if [ -n "$(git status --porcelain src/content/blog public/images)" ]; then
            git add src/content/blog/ public/images/
            git commit -m "chore(blog): auto publish new article [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new articles generated."
          fi
